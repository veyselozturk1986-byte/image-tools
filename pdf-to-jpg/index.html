<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>PDF to JPG Converter - 100% Private & Free</title>
    <meta name="description" content="Convert PDF pages into high-quality JPG images directly in your browser. No file upload required. Safe, private, and fast.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PDF.js & JSZip Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="../index.html" class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                ⚡ PrivacyConvert
            </a>
            <a href="../index.html" class="text-sm font-medium text-indigo-600 hover:underline">
                ← Back to All Tools
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900">PDF to JPG Converter</h1>
            <p class="text-sm text-slate-500 mt-2">Extract image pages from your PDF securely inside your browser.</p>
        </div>

        <!-- Conversion Card -->
        <div class="max-w-xl mx-auto p-6 bg-white rounded-2xl shadow-lg border border-slate-100">
            
            <!-- Drag & Drop Zone -->
            <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:border-indigo-500 hover:bg-slate-50 transition-all">
                <div class="text-4xl mb-2">📄</div>
                <p class="text-slate-700 font-medium">Click to upload or drag & drop PDF</p>
                <p class="text-xs text-slate-400 mt-1">Select .PDF files (100% In-Browser)</p>
            </div>

            <!-- CRITICAL: Hidden File Input -->
            <input type="file" id="fileInput" accept=".pdf,application/pdf" class="hidden" />

            <!-- Action Area -->
            <div id="actionArea" class="mt-6 hidden space-y-4">
                <div class="p-3 bg-slate-100 rounded-lg text-sm font-semibold text-slate-700 truncate" id="fileName">
                    No file selected
                </div>

                <button id="convertBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-md active:scale-95">
                    Convert PDF to JPG
                </button>
            </div>

            <!-- Status Text -->
            <div id="statusText" class="mt-4 text-center text-sm font-medium text-indigo-600 hidden">
                Processing PDF pages...
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        <p>© 2026 PrivacyConvert — 100% Client-Side Processing.</p>
    </footer>

    <!-- JS Logic -->
    <script>
        // PDF.js Worker Tanımlaması (Güvenli Kontrol)
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const actionArea = document.getElementById('actionArea');
        const fileNameDisplay = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const statusText = document.getElementById('statusText');

        let selectedFile = null;

        // Tıklama Olayı (Sayfa yüklenir yüklenmez tetiklenir)
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                selectedFile = e.target.files[0];
                fileNameDisplay.textContent = selectedFile.name;
                actionArea.classList.remove('hidden');
            }
        });

        // Drag & Drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'bg-slate-50');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-indigo-500', 'bg-slate-50');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-slate-50');
            if (e.dataTransfer.files.length) {
                selectedFile = e.dataTransfer.files[0];
                fileNameDisplay.textContent = selectedFile.name;
                actionArea.classList.remove('hidden');
            }
        });

        // Dönüştürme
        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            showStatus("Processing PDF pages locally...");

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const zip = new JSZip();

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: ctx, viewport }).promise;

                    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));

                    if (pdf.numPages === 1) {
                        triggerDownload(blob, `${selectedFile.name.replace(/\.pdf$/i, '')}.jpg`);
                    } else {
                        zip.file(`page-${i}.jpg`, blob);
                    }
                }

                if (pdf.numPages > 1) {
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    triggerDownload(zipBlob, `${selectedFile.name.replace(/\.pdf$/i, '')}_images.zip`);
                }
            } catch (err) {
                console.error(err);
                alert("An error occurred while converting the PDF.");
            } finally {
                hideStatus();
            }
        });

        function triggerDownload(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }

        function showStatus(text) {
            statusText.textContent = text;
            statusText.classList.remove('hidden');
            convertBtn.disabled = true;
            convertBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        function hideStatus() {
            statusText.classList.add('hidden');
            convertBtn.disabled = false;
            convertBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
