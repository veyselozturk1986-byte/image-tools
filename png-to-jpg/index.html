<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert PNG to JPG Online - Fast & Private | PrivacyConvert</title>
    <meta name="description" content="Convert transparent PNG images to clean JPG format. Adjust quality, crop, rotate, and add watermarks directly in your browser with zero data uploads.">
    <link rel="canonical" href="https://yourdomain.com/png-to-jpg/index.html" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="../index.html" class="text-xl font-bold text-indigo-600">⚡ PrivacyConvert</a>
            <nav class="hidden md:flex text-sm text-slate-600 gap-4 font-medium">
                <a href="../pdf-to-jpg/index.html" class="hover:text-indigo-600">PDF to JPG</a>
                <a href="../heic-to-jpg/index.html" class="hover:text-indigo-600">HEIC to JPG</a>
                <a href="../jpg-to-pdf/index.html" class="hover:text-indigo-600">JPG to PDF</a>
                <a href="../png-to-jpg/index.html" class="text-indigo-600 font-bold">PNG to JPG</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900">
                Convert <span class="text-indigo-600">PNG to JPG</span> Images
            </h1>
            <p class="text-slate-500 text-sm mt-2">Convert transparent PNGs to crisp JPG files locally with crop and watermark tools.</p>
        </div>

        <div class="max-w-2xl mx-auto p-6 bg-white rounded-2xl shadow-lg border border-slate-100">
            <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:border-indigo-500 hover:bg-slate-50 transition-all">
                <p class="text-slate-700 font-semibold">Select PNG files or drag & drop</p>
                <p class="text-xs text-slate-400 mt-1">Supports multi-file conversion</p>
            </div>
            <input type="file" id="fileInput" accept="image/png" multiple class="hidden" />

            <div id="actionArea" class="mt-6 hidden space-y-5">
                <div id="previewWrapper" class="p-4 bg-slate-900 rounded-xl border border-slate-800 flex justify-center max-h-[380px] overflow-hidden">
                    <img id="imagePreview" class="max-w-full max-h-[320px] object-contain rounded hidden" alt="PNG Preview" />
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                    <div class="flex gap-2">
                        <button type="button" id="rotateRightBtn" class="px-3 py-1.5 bg-white border border-slate-300 rounded text-xs font-semibold text-slate-700">🔄 Rotate 90°</button>
                        <button type="button" id="toggleCropBtn" class="px-3 py-1.5 bg-indigo-50 border border-indigo-200 rounded text-xs font-semibold text-indigo-700">✂️ Crop Image</button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                        <div>
                            <label class="block font-medium mb-1">Max Width (px):</label>
                            <input type="number" id="resizeWidth" placeholder="Original Size" class="w-full p-2 border rounded bg-white">
                        </div>
                        <div>
                            <label class="block font-medium mb-1">Watermark Text:</label>
                            <input type="text" id="watermarkText" placeholder="e.g. Watermark" class="w-full p-2 border rounded bg-white">
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center text-xs font-medium text-slate-600">
                    <span>JPG Image Quality:</span>
                    <span id="qualityVal" class="font-bold text-indigo-600">85%</span>
                </div>
                <input type="range" id="qualityRange" min="30" max="100" value="85" step="5" class="w-full accent-indigo-600 cursor-pointer">

                <button id="convertBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-md">
                    Convert PNG to JPG
                </button>
            </div>

            <div id="statusText" class="mt-4 text-center text-sm font-semibold text-indigo-600 hidden">Converting PNG...</div>
        </div>
    </main>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const actionArea = document.getElementById('actionArea');
        const imagePreview = document.getElementById('imagePreview');
        const convertBtn = document.getElementById('convertBtn');
        const statusText = document.getElementById('statusText');
        const qualityRange = document.getElementById('qualityRange');
        const qualityVal = document.getElementById('qualityVal');
        const toggleCropBtn = document.getElementById('toggleCropBtn');
        const rotateRightBtn = document.getElementById('rotateRightBtn');
        const resizeWidthInput = document.getElementById('resizeWidth');
        const watermarkInput = document.getElementById('watermarkText');

        let selectedFiles = [];
        let cropper = null;
        let currentRotation = 0;

        qualityRange.addEventListener('input', (e) => qualityVal.textContent = `${e.target.value}%`);
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            if (!files.length) return;
            selectedFiles = Array.from(files);
            if (cropper) { cropper.destroy(); cropper = null; }
            currentRotation = 0;

            actionArea.classList.remove('hidden');
            imagePreview.src = URL.createObjectURL(selectedFiles[0]);
            imagePreview.classList.remove('hidden');
        }

        toggleCropBtn.addEventListener('click', () => {
            if (cropper) {
                cropper.destroy(); cropper = null;
                toggleCropBtn.textContent = "✂️ Crop Image";
            } else {
                cropper = new Cropper(imagePreview, { viewMode: 1, autoCropArea: 0.9 });
                toggleCropBtn.textContent = "✅ Apply Crop";
            }
        });

        rotateRightBtn.addEventListener('click', () => {
            if (cropper) cropper.rotate(90);
            else {
                currentRotation = (currentRotation + 90) % 360;
                imagePreview.style.transform = `rotate(${currentRotation}deg)`;
            }
        });

        convertBtn.addEventListener('click', async () => {
            if (!selectedFiles.length) return;
            statusText.classList.remove('hidden');
            const quality = parseFloat(qualityRange.value) / 100;

            try {
                const zip = new JSZip();
                const isSingle = selectedFiles.length === 1;

                for (let i = 0; i < selectedFiles.length; i++) {
                    let canvas;
                    if (i === 0 && cropper) {
                        canvas = cropper.getCroppedCanvas();
                        // White fill behind transparent crop
                        const ctx = canvas.getContext('2d');
                        ctx.globalCompositeOperation = 'destination-over';
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    } else {
                        const img = new Image();
                        img.src = URL.createObjectURL(selectedFiles[i]);
                        await new Promise(r => img.onload = r);

                        canvas = document.createElement('canvas');
                        canvas.width = img.width; canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);
                    }

                    // Watermark
                    const watermark = watermarkInput.value.trim();
                    if (watermark) {
                        const ctx = canvas.getContext('2d');
                        const fontSize = Math.max(16, Math.floor(canvas.width / 22));
                        ctx.font = `bold ${fontSize}px sans-serif`;
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                        ctx.textAlign = 'right';
                        ctx.fillText(watermark, canvas.width - 20, canvas.height - 20);
                    }

                    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
                    const baseName = selectedFiles[i].name.replace(/\.png$/i, "");

                    if (isSingle) {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `${baseName}.jpg`;
                        a.click();
                    } else {
                        zip.file(`${baseName}.jpg`, blob);
                    }
                }

                if (!isSingle) {
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(zipBlob);
                    a.download = `png_converted_${Date.now()}.zip`;
                    a.click();
                }
            } catch (err) {
                alert("Error converting PNG: " + err.message);
            } finally {
                statusText.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
